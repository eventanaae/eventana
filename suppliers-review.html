const KEY="evt_supplier_rev_v2";
let ch={}; try{ch=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
// ch[ledger]={a:account,nm:name}
let filter="sug", q="";
const listEl=document.getElementById("list"), cntEl=document.getElementById("cnt");
function save(){localStorage.setItem(KEY,JSON.stringify(ch));}
function acctOf(d){ return (ch[d.ledger]&&ch[d.ledger].a!==undefined)?ch[d.ledger].a:(d.account||"Supplies/Purchase"); }
function nameOf(d){ return (ch[d.ledger]&&ch[d.ledger].nm!==undefined)?ch[d.ledger].nm:(d.final||d.ledger); }
function isChg(d){ const c=ch[d.ledger]; if(!c)return false; return (c.a!==undefined&&c.a!==d.account)||(c.nm!==undefined&&c.nm!==(d.final||d.ledger)); }
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function opts(sel){ let s=ACCOUNTS.slice(); if(sel&&!s.includes(sel))s.unshift(sel); let h=s.map(a=>`<option${a===sel?" selected":""}>${esc(a)}</option>`).join(""); h+=`<option value="__new">${NEWOPT}</option>`; return h; }
function render(){
  const tabs=[["sug","🟡 محتاجة مراجعة"],["all","الكل"],["ok","✔ جاهزة"],["chg","✎ المعدّلة"]];
  document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="tab${filter===t[0]?" on":""}" data-f="${t[0]}">${t[1]}</button>`).join("");
  let rows=DATA.filter(d=>{
    if(filter==="sug"&&d.reviewed)return false;
    if(filter==="ok"&&!d.reviewed)return false;
    if(filter==="chg"&&!isChg(d))return false;
    if(q){const h=(d.final+" "+d.ledger+" "+(d.desc||"")).toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  listEl.innerHTML=rows.map(d=>{
    const cur=acctOf(d), custom=!ACCOUNTS.includes(cur), pill=d.reviewed?'<span class="pill p-ok">قرارج</span>':'<span class="pill p-sug">اقتراح</span>';
    const k=encodeURIComponent(d.ledger);
    return `<div class="card${isChg(d)?" changed":""}" data-key="${k}"><div class="top"><div class="nm"><span class="nmtext">${esc(nameOf(d))}</span> <button class="edit" data-act="ename">✎</button> ${pill}</div><div class="amt">${(d.aed||0).toLocaleString()} د · ${d.n}×</div></div>`+
    `<input class="ti nameedit" data-act="nameedit" value="${esc(nameOf(d))}" placeholder="اسم المورّد" style="display:none">`+
    (d.desc?`<div class="desc">بالدفاتر: <b>${esc(d.desc)}</b></div>`:`<div class="desc">—</div>`)+
    `<label class="l">الحساب:</label><select data-act="acct">${opts(cur)}</select>`+
    `<input class="ti newacct" data-act="newacct" placeholder="اكتبي اسم الحساب الجديد" value="${custom?esc(cur):''}" style="display:${custom?'block':'none'}">`+
    `</div>`;
  }).join("")||'<p class="lead">ما فيه نتائج.</p>';
  const n=Object.keys(ch).filter(k=>{const d=DATA.find(x=>x.ledger===k);return d&&isChg(d);}).length;
  cntEl.textContent = n? (n.toLocaleString('ar-EG')+" تغيير") : "٠ تغييرات";
}
function setA(k,val){ if(!ch[k])ch[k]={}; ch[k].a=val; cleanup(k); save(); }
function setNm(k,val){ if(!ch[k])ch[k]={}; ch[k].nm=val; cleanup(k); save(); }
function cleanup(k){ const d=DATA.find(x=>x.ledger===k); if(!d)return; const c=ch[k]; if(c){ if(c.a!==undefined&&c.a===d.account)delete c.a; if(c.nm!==undefined&&c.nm===(d.final||d.ledger))delete c.nm; if(Object.keys(c).length===0)delete ch[k]; } }
listEl.addEventListener("change",e=>{
  const card=e.target.closest(".card"); if(!card)return; const k=decodeURIComponent(card.dataset.key);
  if(e.target.dataset.act==="acct"){
    if(e.target.value==="__new"){ const inp=card.querySelector(".newacct"); inp.style.display="block"; inp.focus(); return; }
    setA(k,e.target.value); render();
  } else if(e.target.dataset.act==="newacct"){
    const v=e.target.value.trim(); if(v){setA(k,v);} render();
  } else if(e.target.dataset.act==="nameedit"){
    const v=e.target.value.trim(); if(v)setNm(k,v); render();
  }
});
listEl.addEventListener("blur",e=>{ const a=e.target.dataset&&e.target.dataset.act; if(a==="newacct"||a==="nameedit"){const v=e.target.value.trim();const card=e.target.closest(".card");const k=decodeURIComponent(card.dataset.key);if(v){if(a==="newacct")setA(k,v);else setNm(k,v);}} },true);
listEl.addEventListener("click",e=>{
  if(e.target.dataset.act==="ename"){
    const card=e.target.closest(".card"); const inp=card.querySelector(".nameedit");
    const show=inp.style.display==="none"; inp.style.display=show?"block":"none"; if(show){inp.focus();inp.select&&inp.select();}
  }
});
document.addEventListener("click",e=>{ if(e.target.classList.contains("tab")){filter=e.target.dataset.f;render();} });
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();render();});
let clrArm=false; document.getElementById("clr").addEventListener("click",()=>{ const b=document.getElementById("clr"); if(!clrArm){clrArm=true;b.textContent="متأكدة؟";setTimeout(()=>{clrArm=false;b.textContent="مسح";},2500);return;} ch={};save();clrArm=false;b.textContent="مسح";render(); });
document.getElementById("cp").addEventListener("click",()=>{
  const out=document.getElementById("out");
  const keys=Object.keys(ch).filter(k=>{const d=DATA.find(x=>x.ledger===k);return d&&isChg(d);});
  if(!keys.length){out.style.display="block";out.textContent="ما فيه تغييرات — كل شي زي ما هو.";return;}
  let lines=keys.map(k=>{const d=DATA.find(x=>x.ledger===k);const c=ch[k];let parts=[];
    if(c.nm!==undefined&&c.nm!==(d.final||d.ledger))parts.push('الاسم: '+(d.final||d.ledger)+' ← '+c.nm);
    if(c.a!==undefined&&c.a!==d.account)parts.push('الحساب: '+c.a);
    return '• '+(d.final||d.ledger)+' — '+parts.join(' · ');});
  let t="تعديلاتي:\n"+lines.join("\n");
  out.style.display="block"; out.textContent=t;
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{},()=>{});
  const b=document.getElementById("cp"); b.textContent="✓ اننسخ"; setTimeout(()=>b.textContent="نسخ التغييرات",1500);
});
render();
</script></body></html>
