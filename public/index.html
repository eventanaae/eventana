<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F9C6DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HRBP Tasks">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>HR Business Partner Tasks</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Caveat:wght@500;600&family=Quicksand:wght@500;600;700&family=Comfortaa:wght@500;700&display=swap">
<style>
/* Layout: Eventana house style — cream paper, Fredoka headings, Nunito Sans body, Caveat script greeting, pink kickers, short colour rules, blush/mint/lavender dots. One calm column. Single light look by design, matching the brand. */
:root{
  color-scheme:light;
  --cream:#FAF6F2; --paper:#FFFDFB; --ink:#3B3641; --ink-soft:#6B6069; --taupe:#B3A8A0;
  --pink:#E94F9C; --teal:#5BCFC5; --teal-ink:#2E9C92; --coral:#F7A98C; --lavender:#B79BE0; --blush:#F9C6DC; --gold:#F7D06B; --mint:#8FD6C4;
  --rule:rgba(59,54,65,.13); --rule-soft:rgba(59,54,65,.07);
  --accent-l:#E94F9C; --accent-d:#E94F9C; --pop:#5BCFC5; --accent:var(--accent-l);
  --accent-soft:color-mix(in srgb,var(--accent) 10%,var(--paper));
  --late:#D9466B; --today:#E0874F; --done:#5BCFC5;
  --display:"Fredoka","Trebuchet MS",sans-serif; --f:"Nunito Sans","Segoe UI",Arial,sans-serif; --script:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}

/* head */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--rule-soft)}
.top small .occ{color:var(--ink);letter-spacing:.12em}
.top small{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.gear{border:0;background:none;color:var(--taupe);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:4px 0}
.gear:hover{color:var(--ink)}
header .script{display:block;font-family:var(--script);font-size:1.7rem;font-weight:600;color:var(--teal-ink);line-height:1;margin:22px 0 4px}
h1{font-size:2.2rem;line-height:1.1;letter-spacing:-.01em}
.rule{width:56px;height:4px;border-radius:3px;background:var(--coral);margin:14px 0 0}
.sub{margin:12px 0 0;color:var(--ink-soft);font-size:.95rem}
.sub button{border:0;background:none;color:var(--taupe);font-size:.8rem;text-decoration:underline;padding:0 4px}

.kick{display:block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 8px}

.quote{display:flex;gap:12px;align-items:flex-start;width:100%;margin-top:18px;border:0;border-left:3px solid var(--blush);text-align:left;background:none;color:var(--ink);padding:2px 0 2px 16px;font-size:1rem;line-height:1.6}
.quote .e{font-size:1.25rem;line-height:1.3;flex:none}
.quote small{display:block;color:var(--taupe);font-size:.75rem;margin-top:4px;font-weight:600}

.occasion{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.occasion::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.occasion .big{font-size:2rem;line-height:1;flex:none}
.occasion b{display:block;font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--accent)}
.occasion span{font-size:.92rem;color:var(--ink-soft)}
.occasion.soon{background:none;border-style:dashed}
.occasion.soon::before{display:none}
.occasion .sprinkle{display:none}

.focus{background:color-mix(in srgb,var(--blush) 38%,var(--paper));border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.focus h2{font-size:.72rem;font-family:var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.focus ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.focus li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.focus li:last-child{border-bottom:0}
.focus li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;transform:translateY(-1px)}
.focus li.late::before{background:var(--late)}
.focus li b{flex:1;min-width:0;font-family:var(--display);font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.focus li span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.focus li.late span{color:var(--late)}
.focus .next{font-size:.9rem;margin:0;color:var(--ink-soft)}

.add{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:6px 6px 6px 18px}
.add:focus-within{border-color:var(--accent)}
.add input[type=text]{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:1rem;outline:none}
.add input::placeholder,.search input::placeholder{color:var(--taupe)}
.date{position:relative;flex:none}
.date button{border:0;background:var(--cream);color:var(--ink-soft);border-radius:999px;padding:9px 12px;font-size:.8rem;font-weight:700;white-space:nowrap}
.date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.go{flex:none;border:0;background:var(--accent);color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.4rem;line-height:1;display:grid;place-items:center}
.go:disabled{opacity:.5}
.wrap>.more{margin-top:-12px;display:flex;flex-direction:column;gap:8px;padding-left:18px}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rep{display:flex;align-items:center;gap:4px;color:var(--teal-ink);font-weight:700;font-size:.85rem}
.rep select{width:auto;border:0;background:none;color:var(--teal-ink);font-weight:700;font-size:.82rem;padding:2px 0;cursor:pointer}
.repeat{color:var(--teal-ink);font-weight:700}
.link{border:0;background:none;color:var(--teal-ink);font-weight:700;font-size:.82rem;padding:2px 0;align-self:flex-start}
textarea{color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px;width:100%;resize:vertical;font-size:.95rem}

.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding:0 4px}
.search span{color:var(--taupe);font-size:.9rem}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--accent)}
mark{background:var(--blush);color:var(--ink);border-radius:3px;padding:0 2px}
.snip{display:block;font-size:.85rem;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere}
.hits{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);font-weight:700;margin:0}

.seg{display:flex;gap:22px;border-bottom:1px solid var(--rule-soft)}
.seg button{border:0;background:none;padding:8px 0 10px;color:var(--taupe);font-family:var(--display);font-weight:500;font-size:1rem;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

ul.list{list-style:none;margin:0;padding:0 16px;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule-soft);border-radius:16px}
.row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.tick{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.6px solid var(--teal);background:transparent;padding:0;display:grid;place-items:center;color:#fff;font-size:.72rem;font-weight:700}
.tick:hover{background:color-mix(in srgb,var(--teal) 18%,transparent)}
.row.done .tick{background:var(--teal)}
.txt{flex:1;min-width:0}
.txt>button.open{border:0;background:none;padding:0;text-align:left;width:100%;display:block;overflow-wrap:anywhere;font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.35;color:var(--ink)}
.row.done .txt>button.open{color:var(--taupe);text-decoration:line-through;text-decoration-color:var(--taupe)}
.has{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral);margin-left:8px;vertical-align:middle}
.when{font-size:.8rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px}
.when.late{color:var(--late);font-weight:700}
.when.today{color:var(--today);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;font-size:.76rem}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blush)}
.x{flex:none;border:0;background:none;color:var(--taupe);font-size:1.1rem;padding:0 4px;line-height:1.4}
.x:hover{color:var(--late)}
.sure{display:flex;gap:6px;flex:none}
.sure button{border:0;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700}
.sure .y{background:var(--late);color:#fff}
.sure .n{background:var(--cream);color:var(--ink)}
.detail{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.detail .save,.copy{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.82rem;align-self:flex-start}
.copy:disabled{opacity:.5}

#view{display:flex;flex-direction:column;gap:16px}
.range{display:flex;gap:12px;flex-wrap:wrap}
.range label{display:flex;flex-direction:column;gap:4px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);font-weight:700;flex:1;min-width:140px}
.range input{color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:9px 12px;font-size:.95rem;letter-spacing:0;text-transform:none;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:600}
.chip span{color:var(--accent);margin-left:4px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] span{color:var(--blush)}
.count{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count b{font-family:var(--display);font-size:1.3rem;font-weight:600}
.count .copy+.copy{background:var(--cream);color:var(--ink);border:1px solid var(--rule)}
.summary{background:var(--paper);border-left:3px solid var(--mint);border-radius:0 14px 14px 0;padding:14px 18px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
.month{display:flex;flex-direction:column;gap:8px}
.month h3{font-size:.72rem;font-family:var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:4px 0 0}
.empty{color:var(--taupe);padding:22px 4px;font-style:italic}

.settings{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px}
.settings h2{font-size:1.3rem}
.settings h3{font-size:.7rem;font-family:var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);font-weight:700;margin:0 0 10px}
.swatches{display:flex;flex-wrap:wrap;gap:14px}
.sw{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--ink-soft);width:62px}
.sw i{display:block;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--rule);overflow:hidden;position:relative}
.sw i b{position:absolute;top:0;bottom:0;display:block}
.sw i b:first-child{left:0;right:50%}
.sw i b:last-child{left:50%;right:0}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.fontbtn{border:1px solid var(--rule);background:var(--cream);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink)}
.fontbtn b{display:block;font-size:1.2rem;line-height:1.25;font-weight:600}
.fontbtn small{color:var(--taupe);font-size:.74rem}
.fontbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.95rem}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.settings .row2{display:flex;gap:8px;flex-wrap:wrap}
.settings .row2 .copy:first-child{background:var(--cream);color:var(--ink);border:1px solid var(--rule)}

.welcome{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8vh}
.welcome h1{font-size:2rem}
.welcome p{margin:0;color:var(--ink-soft)}
.welcome input{color:var(--ink);background:var(--cream);border:1px solid var(--rule);border-radius:999px;padding:13px 18px;width:100%;max-width:300px;text-align:center;font-size:1.05rem}
.flower{font-family:var(--script);font-size:1.8rem;color:var(--teal-ink);line-height:1}
.go.wide{width:auto;padding:0 28px;border-radius:999px;font-size:.95rem;font-weight:700}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:.9rem;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .row.done .tick{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
}
/* ---------- colour layer: the theme tints the whole page, brand circles, speech bubbles ---------- */
:root{
  --c2:#B79BE0; --c3:#F7D06B;
  --bg:color-mix(in srgb,var(--accent-l) 8%,#FFFDFB);
  --band:color-mix(in srgb,var(--accent-l) 26%,#FFFDFB);
  --band2:color-mix(in srgb,var(--pop) 30%,#FFFDFB);
  --tint-a:color-mix(in srgb,var(--accent-l) 12%,#FFFDFB);
  --tint-b:color-mix(in srgb,var(--pop) 18%,#FFFDFB);
  --tint-c:color-mix(in srgb,var(--c2) 22%,#FFFDFB);
  --tint-d:color-mix(in srgb,var(--c3) 30%,#FFFDFB);
}
body{background:var(--bg);position:relative;overflow-x:hidden}
.wrap{position:relative;z-index:1}

/* hero band, like the corporate profile cover */
.hero{position:relative;overflow:hidden;background:var(--band);border-radius:28px;padding:20px 20px 24px}
.hero>*{position:relative}
.hero .top{border-bottom-color:color-mix(in srgb,var(--ink) 10%,transparent)}
.hero .gear{background:rgba(255,253,251,.75);color:var(--ink);border-radius:999px;padding:5px 12px}
.hero .rule{background:var(--paper)}
.hero .sub{color:var(--ink)}

/* the daily note as a speech bubble */
.quote{background:var(--paper);border:0;border-radius:22px;padding:14px 16px;margin-top:-6px;box-shadow:0 6px 18px -12px color-mix(in srgb,var(--accent-l) 60%,transparent);position:relative;align-items:center}
.quote::before{content:"";position:absolute;left:26px;top:-9px;width:18px;height:18px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.quote .e{background:var(--tint-b);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem}

/* coloured cards */
.focus{background:var(--band2);border-radius:24px;position:relative;overflow:hidden}
.focus li{border-bottom-color:color-mix(in srgb,var(--ink) 9%,transparent)}
.focus li::before{background:var(--accent-l)}
.add{border:0;box-shadow:0 6px 18px -12px color-mix(in srgb,var(--accent-l) 55%,transparent)}
.date button{background:var(--tint-a);color:var(--ink)}
.search{background:var(--paper);border:0;border-radius:999px;padding:0 16px;box-shadow:0 4px 14px -12px color-mix(in srgb,var(--accent-l) 55%,transparent)}
.seg{background:var(--paper);border:0;border-radius:999px;padding:4px;gap:4px;align-self:flex-start;box-shadow:0 4px 14px -12px color-mix(in srgb,var(--accent-l) 55%,transparent)}
.seg button{padding:7px 16px;border:0;border-radius:999px;margin:0;font-size:.95rem}
.seg button[aria-selected="true"]{background:var(--accent-l);color:#fff}

/* each task its own little card */
ul.list{background:none;border:0;padding:0;gap:10px}
.row{background:var(--paper);border:0;border-radius:18px;padding:14px;box-shadow:0 4px 14px -12px color-mix(in srgb,var(--ink) 40%,transparent)}
.row:last-child{border-bottom:0}
.tick{border-color:var(--accent-l)}
.row.done .tick{background:var(--accent-l);border-color:var(--accent-l)}
.tag{background:var(--tint-c);color:var(--ink);border-radius:999px;padding:2px 10px}
.tag::before{display:none}
.tag.c0{background:var(--tint-a)} .tag.c1{background:var(--tint-b)} .tag.c2{background:var(--tint-c)} .tag.c3{background:var(--tint-d)}
.month h3{background:var(--paper);align-self:flex-start;border-radius:999px;padding:4px 12px}
.chip{border:0;box-shadow:0 3px 10px -8px color-mix(in srgb,var(--ink) 40%,transparent)}
.chip[aria-pressed="true"]{background:var(--accent-l)}
.chip[aria-pressed="true"] span{color:#fff}
.summary{border-left:0;border-radius:22px;background:var(--paper);position:relative;margin-top:6px}
.summary::before{content:"";position:absolute;left:26px;top:-9px;width:18px;height:18px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.empty{background:var(--paper);border-radius:22px;padding:22px;font-style:normal;text-align:center}
.settings{border:0;border-radius:24px}
.welcome{border:0;background:var(--paper);box-shadow:0 10px 30px -18px color-mix(in srgb,var(--accent-l) 60%,transparent)}
.toast{background:var(--accent-l)}
.tag.sorting{background:none;color:var(--taupe);font-style:italic;padding:2px 0}
.catpick{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.catpick select{font:inherit;font-weight:600;color:var(--ink);background:var(--tint-a);border:0;border-radius:999px;padding:6px 10px}
#view>.chips{margin-bottom:-4px}
.cal{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.cal a{color:var(--ink);background:var(--tint-b);border-radius:999px;padding:5px 12px;text-decoration:none}
.cal a:hover{background:var(--tint-a)}
.err{margin:0;color:var(--late);font-weight:600;font-size:.9rem}
.welcome input[hidden]{display:none}
.hint{margin:0 0 10px;color:var(--ink-soft);font-size:.9rem}
.nameinput{color:var(--ink);background:var(--cream);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font-size:.95rem;flex:1;min-width:0}
</style>

</head>
<body>
<div class="wrap" id="hi" hidden>
  <form class="welcome" id="authForm" autocomplete="on" novalidate>
    <div class="flower" aria-hidden="true">Hello there…</div>
    <h1 id="authTitle">HR Business Partner Tasks</h1>
    <p id="authSub">Create your account to start</p>
    <input id="a-name" name="username" autocomplete="username" maxlength="40" placeholder="Your name" aria-label="Your name" required>
    <input id="a-pw" name="password" type="password" autocomplete="new-password" placeholder="Password (6+ characters)" aria-label="Password" required minlength="6">
    <p class="err" id="authErr" hidden></p>
    <button class="go wide" type="submit" id="authBtn">Create account</button>
    <button type="button" class="link" id="authSwitch">I already have an account</button>
  </form>
</div>

<div class="wrap" id="app">
  <header class="hero">
    <div class="top"><small id="today"></small><button type="button" class="gear" data-act="settings" aria-expanded="false" id="gearBtn">Settings</button></div>
    <h1 id="hello">My tasks</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="sub" id="sub"></p>
  </header>
  <button type="button" class="quote" id="quote" data-act="quote" aria-label="Show another message"></button>

  <section class="settings" id="settings" hidden>
    <h2>Make it yours</h2>
    <div><h3>Color</h3><div class="swatches" id="swatches"></div></div>
    <div><h3>Font</h3><div class="fonts" id="fonts"></div></div>
    <label class="switch" for="hol">Holiday themes (Halloween, Ramadan, National Day…)<input type="checkbox" id="hol"></label>
    <div><h3>Your name</h3><div class="row2"><input id="s-name" maxlength="40" aria-label="Your name" class="nameinput"><button type="button" class="copy" data-act="savename">Save</button></div></div>
    <div><h3>Phone notifications</h3><p class="hint" id="pushHint">Get your deadlines and special days every morning at 7:44.</p><div class="row2"><button type="button" class="copy" data-act="push" id="pushBtn">Turn on notifications</button></div></div>
    <div class="row2"><button type="button" class="copy" data-act="settings">Done</button><button type="button" class="copy" data-act="logout">Sign out</button></div>
  </section>

  <section class="occasion" id="occasion" hidden></section>

  <section class="focus" id="focus" hidden></section>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="f-title" placeholder="What do you need to do?" aria-label="Task">
    <div class="date">
      <button type="button" id="dateLbl" tabindex="-1">📅 Due</button>
      <input type="date" id="f-due" aria-label="Deadline (optional)">
    </div>
    <button class="go" id="addBtn" type="submit" aria-label="Add">+</button>
  </form>
  <div class="more">
    <div class="opts">
      <button type="button" class="link" id="moreBtn">+ Add details</button>
      <label class="rep">↻
        <select id="f-rep" aria-label="Repeat">
          <option value="">Doesn't repeat</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month (same date)</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
    </div>
    <textarea id="f-notes" rows="3" placeholder="Details, who asked, notes…" hidden aria-label="Details"></textarea>
  </div>

  <div class="search">
    <span aria-hidden="true">🔍</span>
    <input type="search" id="q" placeholder="Search any word… a name, a case, a training" aria-label="Search tasks" autocomplete="off">
  </div>

  <nav class="seg" role="tablist">
    <button role="tab" data-view="open" aria-selected="true">To Do</button>
    <button role="tab" data-view="year" aria-selected="false">My Achievements This Year</button>
  </nav>

  <main id="view"><div class="empty">Loading…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let uid=null,me=null,myName="",unsub=null;
  const col=()=>tasksCol;
  let tasks=[],db=null,view="open",loaded=false,ask=null,openId=null,cat=null,tcat=null,classified=false,sumText="",sumBusy=false;
  let fromD=new Date().getFullYear()+"-01-01",toD=(d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))(new Date());

  const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const today=()=>ymd(new Date());
  const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
  const left=s=>s?Math.round((parse(s)-parse(today()))/864e5):null;
  const fmt=s=>{const d=parse(s);return M[d.getMonth()]+" "+d.getDate()};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2000)}
  function when(t){const n=left(t.due);if(n===null)return["",""];if(n<0)return["late","Overdue · was "+fmt(t.due)];if(n===0)return["today","Today"];if(n===1)return["today","Tomorrow"];return["",fmt(t.due)]}

  let q="";
  const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  function hl(s){const e=esc(s);if(!q)return e;const w=q.split(/\s+/).filter(Boolean).map(x=>reEsc(esc(x)));if(!w.length)return e;return e.replace(new RegExp("("+w.join("|")+")","gi"),"<mark>$1</mark>")}
  function snip(n){const w=q.toLowerCase().split(/\s+/).filter(Boolean)[0]||"";const i=n.toLowerCase().indexOf(w);if(i<0)return n.length>90?n.slice(0,90)+"…":n;const a=Math.max(0,i-40);return (a?"…":"")+n.slice(a,a+110)+(n.length>a+110?"…":"")}
  const now=new Date(); $("#today").textContent=now.toLocaleDateString("en-GB",{weekday:"long"})+" · "+now.getDate()+" "+M[now.getMonth()];

  function render(){
    document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===view)));
    const open=tasks.filter(t=>t.status!=="done").sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
    const late=open.filter(t=>left(t.due)!==null&&left(t.due)<0).length;
    const h=new Date().getHours();
    $("#hello").innerHTML=`<span class="script">${h<12?"Good morning,":h<18?"Good afternoon,":"Good evening,"}</span>${myName?esc(myName):"My tasks"}`;
    $("#sub").innerHTML=!loaded?"":(open.length?`You have <span class="num">${open.length}</span> open task${open.length>1?"s":""}${late?`, <span class="num" style="color:var(--late);font-weight:700">${late}</span> overdue`:""}`:"Nothing on your list. Enjoy ✨");
    renderOccasion();
    renderQuote(open,late);
    renderFocus(open);
    const v=$("#view");
    if(!loaded){v.innerHTML=`<div class="empty">Loading…</div>`;return}
    $(".seg").hidden=!!q;
    if(q){
      const words=q.toLowerCase().split(/\s+/).filter(Boolean);
      const hits=tasks.filter(t=>{const hay=[t.title,t.notes,t.category].join(" ").toLowerCase();return words.every(w=>hay.includes(w))})
        .sort((a,b)=>((b.completedAt||b.createdAt||"")).localeCompare(a.completedAt||a.createdAt||""));
      v.innerHTML=hits.length?`<p class="hits"><span class="num">${hits.length}</span> result${hits.length>1?"s":""} for “${esc(q)}”</p><ul class="list">${hits.map(row).join("")}</ul>`
        :`<div class="empty">Nothing found for “${esc(q)}”. Try another word.</div>`;
      return;
    }
    if(view==="open"){
      if(!open.length){v.innerHTML=`<div class="empty">Type any request above and tap +</div>`;return}
      const cc={};open.forEach(t=>{const c=CATS.includes(t.category)?t.category:"Sorting…";cc[c]=(cc[c]||0)+1});
      if(tcat&&!cc[tcat])tcat=null;
      const shown=open.filter(t=>!tcat||(CATS.includes(t.category)?t.category:"Sorting…")===tcat);
      v.innerHTML=`<div class="chips"><button class="chip" data-act="tcat" data-cat="" aria-pressed="${!tcat}">All <span class="num">${open.length}</span></button>`+
        Object.entries(cc).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="chip" data-act="tcat" data-cat="${esc(c)}" aria-pressed="${tcat===c}">${esc(c)} <span class="num">${n}</span></button>`).join("")+`</div>`+
        `<ul class="list">${shown.map(row).join("")}</ul>`;
    }else{
      const inRange=tasks.filter(t=>t.status==="done"&&t.completedAt&&t.completedAt>=fromD&&t.completedAt<=toD);
      const counts={};inRange.forEach(t=>{const c=t.category||"Uncategorized";counts[c]=(counts[c]||0)+1});
      if(cat&&!counts[cat])cat=null;
      const done=inRange.filter(t=>!cat||(t.category||"Uncategorized")===cat).sort((a,b)=>b.completedAt.localeCompare(a.completedAt));
      const chips=`<div class="chips"><button class="chip" data-act="cat" data-cat="" aria-pressed="${!cat}">All <span class="num">${inRange.length}</span></button>`+
        Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${cat===c}">${esc(c)} <span class="num">${n}</span></button>`).join("")+`</div>`;
      const range=`<div class="range"><label>From<input type="date" id="r-from" value="${fromD}"></label><label>To<input type="date" id="r-to" value="${toD}"></label></div>`;
      if(!done.length){v.innerHTML=range+chips+`<div class="empty">No finished tasks in this period. Everything you complete shows up here.</div>`;return}
      const by={};done.forEach(t=>{const k=t.completedAt.slice(0,7);(by[k]=by[k]||[]).push(t)});
      v.innerHTML=range+chips+
        `<div class="count"><b>You finished <span class="num">${done.length}</span> task${done.length>1?"s":""}${cat?" in "+esc(cat):""}</b><span style="display:flex;gap:6px"><button class="copy" data-act="sum" ${sumBusy?"disabled":""}>Summary</button><button class="copy" data-act="copy">Copy</button></span></div>`+
        (sumText?`<div class="summary" id="sumBox">${esc(sumText)}</div>`:"")+
        Object.keys(by).sort().reverse().map(k=>`<section class="month"><h3>${M[+k.slice(5,7)-1]} ${k.slice(0,4)}</h3><ul class="list">${by[k].map(row).join("")}</ul></section>`).join("");
    }
  }
  const Q=[
    ["☀️","New day, fresh start. Pick the one thing that matters most and begin there."],
    ["💗","You make work feel safer for a lot of people. That's not small."],
    ["📌","Clear the oldest item first. Your brain will thank you."],
    ["🌿","Progress over perfection. Every closed case counts."],
    ["🎀","You've got this. One email, one call, one decision at a time."],
    ["✨","The people you helped this week won't forget it."],
    ["🧡","Breathe, prioritise, go. You're better at this than you think."],
    ["🌼","A tidy list is a calm mind. Let's tick a few off."],
    ["💫","Today's small wins become this year's big story."],
    ["🌷","Be proud of the work nobody sees. It still matters."],
    ["🍵","Slow and steady still finishes. Start with one."],
    ["🌟","Your achievements list is growing. Keep feeding it."],
    ["💐","Good HR is quiet magic. Go do your magic."],
    ["🪄","Hard conversations get easier when you're prepared. You are."],
    ["🌸","Kind and firm is a superpower. Use it today."],
    ["📈","Every follow-up you close builds trust. Keep going."],
    ["🤍","You don't have to carry it all at once. Just the next step."],
    ["🎯","Deadlines first, nice-to-haves later. You know the drill."],
    ["🌻","Show up for yourself the way you show up for everyone else."],
    ["💌","Someone's day gets better because of your work. Start now."],
    ["🌷","One task at a time. You don't have to do it all today, just the next thing."],
    ["✨","Every request you close is someone at work feeling heard. That matters."],
    ["💪","You've handled harder days than this one. Let's go."],
    ["☕","Small steps still move you forward. Pick one and start."],
    ["🌸","Done is better than perfect. Tick something off and feel good about it."],
    ["🎯","Focus on what's due first. The rest can wait its turn."],
    ["🦋","You're building a year you'll be proud of, one task at a time."],
    ["💜","Be kind to yourself today. You're doing more than you think."],
    ["🌟","Your future self at review time is going to thank you for this."],
    ["🍀","Start with the easiest one. Momentum is magic."],
    ["🌈","People come to you because you make things better. Keep shining."],
    ["🔥","Twenty focused minutes can clear what's been sitting there for days."],
  ];
  const CHEERS=["Yay! 🎉 Added to your achievements","Look at you go ✨","One down 💪 Proud of you","Done and dusted 🌸","Another win for the year 🌟"];
  let qi=null;
  // ---------- personal look ----------
  const COLORS={
    eventana:{n:"Eventana",l:"#E94F9C",d:"#E94F9C",pop:"#5BCFC5",c2:"#B79BE0",c3:"#F7D06B"},
    blush:{n:"Blush",l:"#D9578F",d:"#D9578F",pop:"#F9C6DC",c2:"#F7A98C",c3:"#B79BE0"},
    lavender:{n:"Lavender",l:"#8F6CCB",d:"#8F6CCB",pop:"#F9C6DC",c2:"#8FD6C4",c3:"#F7D06B"},
    teal:{n:"Teal",l:"#2E9C92",d:"#2E9C92",pop:"#F9C6DC",c2:"#F7D06B",c3:"#B79BE0"},
    coral:{n:"Coral",l:"#E07A5A",d:"#E07A5A",pop:"#8FD6C4",c2:"#F9C6DC",c3:"#F7D06B"},
    taupe:{n:"Mocha",l:"#8A6A58",d:"#8A6A58",pop:"#F9C6DC",c2:"#D9C3B0",c3:"#8FD6C4"},
  };
  const FONTS={
    brand:{n:"Nunito Sans",f:'"Nunito Sans"'},fredoka:{n:"Fredoka",f:'"Fredoka"'},
    quicksand:{n:"Quicksand",f:'"Quicksand"'},comfortaa:{n:"Comfortaa",f:'"Comfortaa"'},
  };
  let profile={},prefs={color:"eventana",font:"brand",holidays:true};

  // ---------- special days ----------
  function hijri(d){try{const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric"}).formatToParts(d);return{m:+p.find(x=>x.type==="month").value,d:+p.find(x=>x.type==="day").value}}catch(_){return null}}
  const UAE={l:"#00843d",d:"#4cc07a",pop:"#e0313f"};
  function occasionOn(d){
    const m=d.getMonth()+1,day=d.getDate(),h=hijri(d),md=m*100+day;
    const IS={l:"#2b4c7e",d:"#2b4c7e",pop:"#d4a72c"}, EID={l:"#0f7c76",d:"#0f7c76",pop:"#e0b13a"};
    if(h){
      if(h.m===9&&h.d===19) return{e:"🤍",n:"Zayed Humanitarian Day",t:"Today is Zayed Humanitarian Day",...IS};
      if(h.m===9) return{e:"🌙",n:"Ramadan",t:"Ramadan Kareem",...IS};
      if(h.m===10&&h.d<=3) return{e:"🎉",n:"Eid Al Fitr",t:"Today is Eid Al Fitr · Eid Mubarak",...EID};
      if(h.m===12&&h.d===9) return{e:"🕋",n:"Arafah Day",t:"Today is Arafah Day",...IS};
      if(h.m===12&&h.d>=10&&h.d<=12) return{e:"🐑",n:"Eid Al Adha",t:"Today is Eid Al Adha · Eid Mubarak",...EID};
      if(h.m===1&&h.d===1) return{e:"🌙",n:"Islamic New Year",t:"Today is Islamic New Year",...IS};
      if(h.m===3&&h.d===12) return{e:"🌙",n:"the Prophet's Birthday",t:"Today is the Prophet's Birthday ﷺ",...IS};
      if(h.m===7&&h.d===27) return{e:"🌙",n:"Isra and Mi'raj",t:"Today is Isra and Mi'raj",...IS};
    }
    const UAE={l:"#00843d",d:"#00843d",pop:"#e0313f"};
    const F={
      101:{e:"🎆",n:"New Year's Day",l:"#3b3fb3",pop:"#e8b730"},
      214:{e:"💕",n:"Valentine's Day",l:"#d23f6a",pop:"#f9c6dc"},
      308:{e:"💐",n:"International Women's Day",l:"#8f6ccb",pop:"#e94f9c"},
      315:{e:"🧸",n:"Emirati Children's Day",...UAE},
      321:{e:"🌷",n:"Mother's Day",l:"#d9578f",pop:"#f9c6dc"},
      520:{e:"🤝",n:"International HR Day",l:"#e94f9c",pop:"#5bcfc5"},
      621:{e:"👔",n:"Father's Day",l:"#2b4c7e",pop:"#5bcfc5"},
      828:{e:"🇦🇪",n:"Emirati Women's Day",...UAE},
      1005:{e:"🍎",n:"World Teachers' Day",l:"#e07a5a",pop:"#f7d06b"},
      1010:{e:"💚",n:"World Mental Health Day",l:"#2e9c92",pop:"#8fd6c4"},
      1031:{e:"🎃",n:"Halloween",l:"#d9621b",pop:"#7a3fbf"},
      1103:{e:"🇦🇪",n:"UAE Flag Day",...UAE},
      1130:{e:"🕊️",n:"Commemoration Day",...UAE},
      1202:{e:"🇦🇪",n:"UAE National Day",...UAE},
      1203:{e:"🇦🇪",n:"UAE National Day",...UAE},
      1225:{e:"🎄",n:"Christmas",l:"#c2312f",pop:"#2f8a4a"},
      1231:{e:"🥂",n:"New Year's Eve",l:"#3b3fb3",pop:"#e8b730"},
    }[md];
    if(F) return Object.assign({d:F.l,t:"Today is "+F.n},F);
    return null;
  }
  function applyTheme(){
    const occ=prefs.holidays!==false?occasionOn(new Date()):null;
    const c=occ||COLORS[prefs.color]||COLORS.eventana;
    const r=document.documentElement.style;
    r.setProperty("--accent-l",c.l);r.setProperty("--accent-d",c.d);r.setProperty("--pop",c.pop);r.setProperty("--c2",c.c2||"#B79BE0");r.setProperty("--c3",c.c3||"#F7D06B");
    const f=FONTS[prefs.font]||FONTS.brand; r.setProperty("--f",f.f+',"Segoe UI",system-ui,sans-serif');
  }
  function renderOccasion(){
    $("#occasion").hidden=true;
    const d=new Date(); let t=d.toLocaleDateString("en-GB",{weekday:"long"})+" · "+d.getDate()+" "+M[d.getMonth()];
    const o=prefs.holidays!==false?occasionOn(d):null;
    $("#today").innerHTML=esc(t)+(o?` <span class="occ">· ${esc(o.t)} ${o.e}</span>`:"");
  }
  function renderSettings(){
    $("#swatches").innerHTML=Object.entries(COLORS).map(([k,c])=>`<button type="button" class="sw" data-act="color" data-k="${k}" aria-pressed="${(COLORS[prefs.color]?prefs.color:"eventana")===k}"><i><b style="background:${c.l}"></b><b style="background:${c.pop}"></b></i>${c.n}</button>`).join("");
    $("#fonts").innerHTML=Object.entries(FONTS).map(([k,f])=>`<button type="button" class="fontbtn" data-act="font" data-k="${k}" aria-pressed="${(FONTS[prefs.font]?prefs.font:"brand")===k}" style="font-family:${esc(f.f)},sans-serif"><b>Aa</b><small>${f.n}</small></button>`).join("");
    $("#hol").checked=prefs.holidays!==false;
  }
  let saving=Promise.resolve();
  function saveProfile(){ if(!me)return; const snap=JSON.parse(JSON.stringify(profile)); saving=saving.then(()=>me.set(snap)).catch(()=>toast("Couldn't save. Try again")); }
  function setPref(k,v){prefs[k]=v;profile.prefs=Object.assign({},prefs);applyTheme();renderSettings();render();saveProfile()}

  // ---------- a fresh message every day ----------
  let dq=null;
  async function dailyQuote(){
    const td=today(); const saved=profile.quote;
    if(saved&&saved.date===td){dq=saved;render();return}
    const s=await getSample(); if(!s)return;
    const occ=occasionOn(new Date()); const recent=(profile.recentQuotes||[]).slice(-20);
    try{
      const out=await s.json(`Write one short, warm, encouraging message (max 22 words) for ${myName||"a woman"}, an HR Business Partner in the UAE, to read when she opens her task list this morning. It should motivate her to get to work and feel good about herself. Friendly and cute, not cheesy, no hashtags. ${occ?"Today is "+occ.n+", you may gently nod to it. ":""}Don't repeat any of these: ${JSON.stringify(recent)}.
Return JSON: {"emoji": one emoji, "text": the message}`,{modelTier:"quick"});
      if(out&&out.text){dq={date:td,e:String(out.emoji||"🌷").slice(0,4),t:String(out.text).slice(0,220)};
        profile.quote=dq;profile.recentQuotes=recent.concat(dq.t).slice(-20);saveProfile();render()}
    }catch(_){}
  }
  function renderQuote(open,late){
    const el=$("#quote"); if(!loaded){el.hidden=true;return}
    let e,t;
    if(qi===null&&dq){e=dq.e;t=dq.t}
    else{const d=new Date();const base=(d.getFullYear()*372+d.getMonth()*31+d.getDate())%Q.length;[e,t]=Q[((qi===null?0:qi+1)+base)%Q.length]}
    const hint=late?"A couple of things slipped. That's okay, start with those 💜":open.length?"Tap for another one":"Your list is clear. Enjoy it 🌸";
    el.innerHTML=`<span class="e" aria-hidden="true">${e}</span><span>${esc(t)}<small>${hint}</small></span>`; el.hidden=false;
  }
  function renderFocus(open){
    const f=$("#focus"); if(!loaded||!open.length){f.hidden=true;return}
    const now=open.filter(t=>left(t.due)!==null&&left(t.due)<=0);
    const tmr=open.filter(t=>left(t.due)===1);
    const nextUp=open.find(t=>left(t.due)!==null&&left(t.due)>1);
    const li=t=>{const n=left(t.due);return `<li class="${n<0?"late":""}"><b>${esc(t.title)}</b><span>${n<0?(-n)+"d overdue":"Today"}</span></li>`};
    let html="";
    if(now.length) html+=`<h2>Focus on today</h2><ul>${now.map(li).join("")}</ul>`;
    else html+=`<h2>No deadlines today</h2>`;
    if(tmr.length) html+=`<p class="next">Tomorrow: ${tmr.map(t=>esc(t.title)).join(", ")}</p>`;
    else if(!now.length&&nextUp) html+=`<p class="next">Next up: ${esc(nextUp.title)} · ${fmt(nextUp.due)}</p>`;
    else if(!now.length) html+=`<p class="next">A calm day. Chip away at whatever you can.</p>`;
    f.innerHTML=html; f.hidden=false;
  }
  function filteredDone(){return tasks.filter(t=>t.status==="done"&&t.completedAt&&t.completedAt>=fromD&&t.completedAt<=toD&&(!cat||(t.category||"Uncategorized")===cat)).sort((a,b)=>a.completedAt.localeCompare(b.completedAt))}

  const CATDEF={
    "Employee Grievances":"complaints raised by employees, disputes, harassment or conflict cases, grievance meetings and investigations, employee concerns escalated to HR",
    "Consequence Management":"disciplinary action, warnings, misconduct, policy violations, investigations leading to sanctions, show-cause letters, disciplinary committees",
    "Transfers & Movement":"internal transfers, secondments, promotions, role changes, relocations, job rotations, acting assignments, organisational moves",
    "Retention":"retention cases, resignations at risk, counter-offers, stay interviews, engagement of key talent, exit-risk follow-up, exit interviews",
    "PM Governance":"performance management governance: goal setting, appraisal cycles, calibration, ratings moderation, PIPs, performance reviews and their compliance",
    "General & Governance":"HR policies and procedures, compliance, audits, approvals, committees, HR reporting and data, org governance, general HR admin and coordination",
    "Recruitment":"hiring, vacancies, job descriptions, interviews, offers, onboarding of new joiners",
    "Training & Development":"trainings, mandatory courses, workshops, learning plans, development programmes, succession and capability building",
    "Compensation & Benefits":"salary, allowances, benefits, payroll queries, grading, rewards and recognition",
    "Other":"anything that clearly fits none of the above",
  };
  const CATS=Object.keys(CATDEF);
  let sample=null,sampleTried=false;
  async function getSample(){return null}
  // ---------- automatic sorting by HR keywords (no AI) ----------
  const RULES=[
    ["Consequence Management",["disciplin","warning letter","warning","misconduct","violation","show cause","show-cause","sanction","penalt","suspension","consequence","investigation","deduction","absenteeism","absent without","cm","مخالف","انذار","إنذار","تحقيق","جزاء","عقوب","تأديب","خصم","غياب"]],
    ["Employee Grievances",["grievance","complain","harass","bully","conflict","dispute","escalat","er case","employee relation","er","شكوى","شكاوى","تظلم","تحرش","خلاف","نزاع","تصعيد"]],
    ["Retention",["retention","retain","resign","counter offer","counter-offer","stay interview","exit interview","attrition","turnover","flight risk","notice period","استقال","استبقاء","الاحتفاظ","مقابلة خروج","فترة الإشعار"]],
    ["Transfers & Movement",["transfer","movement","secondment","promotion","promote","relocat","rotation","acting","internal move","role change","job change","redeploy","نقل","ترقي","ترقية","انتداب","تكليف","تدوير"]],
    ["PM Governance",["pm","performance","appraisal","calibration","kpi","kpis","goal setting","goals","objectives","rating","pip","mid-year","mid year","year-end","evaluation","scorecard","أداء","تقييم","أهداف","مؤشرات"]],
    ["Recruitment",["recruit","hiring","hire","vacanc","interview","candidate","offer letter","job description","jd","onboard","new joiner","headhunt","shortlist","توظيف","مقابلة","مرشح","شاغر","تعيين","عرض وظيفي"]],
    ["Training & Development",["training","trainings","course","workshop","learning","development","mandatory","certificat","coaching","mentor","succession","upskill","induction","l&d","تدريب","دورة","ورشة","تطوير","تأهيل"]],
    ["Compensation & Benefits",["salary","payroll","allowance","benefit","bonus","increment","grade","grading","compensation","reward","insurance","medical card","ticket","housing","راتب","رواتب","بدل","مكافأ","علاوة","تأمين","سكن"]],
    ["General & Governance",["policy","procedure","governance","compliance","audit","committee","approval","report","dashboard","data","headcount","memo","circular","manpower","budget","org chart","structure","meeting","سياسة","إجراء","حوكمة","تدقيق","لجنة","تقرير","اعتماد","تعميم","هيكل","اجتماع"]],
  ];
  const kwRe=k=>/^[a-z&]{1,3}$/.test(k)?new RegExp("(^|[^a-z])"+k.replace(/&/g,"\\&")+"([^a-z]|$)"):null;
  const RULES_C=RULES.map(([c,ks])=>[c,ks.map(k=>[k,kwRe(k)])]);
  function autoCategory(title,notes){
    const txt=(" "+(title||"")+" . "+(title||"")+" . "+(notes||"")+" ").toLowerCase();
    let best="General & Governance",score=0;
    for(const [c,ks] of RULES_C){let n=0;for(const [k,re] of ks){if(re?re.test(txt):txt.includes(k))n++}if(n>score){score=n;best=c}}
    return best;
  }
  async function classify(){
    const todo=tasks.filter(t=>!CATS.includes(t.category));
    for(const t of todo){try{await col().doc(t.id).update({category:autoCategory(t.title,t.notes)})}catch(_){}}
  }
  async function summarize(){
    const list=filteredDone(); const by={};
    list.forEach(t=>{const c=t.category||"General & Governance";(by[c]=by[c]||[]).push(t)});
    const parts=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([c,ts])=>`${c} — ${ts.length} task${ts.length>1?"s":""}\n`+ts.map(t=>"  • "+t.title+(t.notes?" ("+t.notes.split("\n")[0].slice(0,80)+")":"")).join("\n"));
    sumText=`From ${fmt(fromD)} to ${fmt(toD)} you completed ${list.length} task${list.length>1?"s":""} across ${parts.length} area${parts.length>1?"s":""}.\n\n`+parts.join("\n\n");
    render();
  }
  const catIdx=c=>{let h=0;for(const ch of String(c))h=(h*31+ch.charCodeAt(0))>>>0;return h%4};
  function nextDue(t){
    const base=parse(t.due||today()); const td=parse(today());
    const step=d=>{const n=new Date(d);
      if(t.repeat==="weekly")n.setDate(n.getDate()+7);
      else if(t.repeat==="monthly"){const want=t.rday||n.getDate();n.setDate(1);n.setMonth(n.getMonth()+1);const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();n.setDate(Math.min(want,last))}
      else if(t.repeat==="yearly"){n.setFullYear(n.getFullYear()+1)}
      return n};
    let n=step(base); while(n<=td) n=step(n);
    return ymd(n);
  }
  const RR={weekly:"WEEKLY",monthly:"MONTHLY",yearly:"YEARLY"};
  function nextDay(d){const n=parse(d);n.setDate(n.getDate()+1);return ymd(n)}
  function gcal(t){const a=t.due.replace(/-/g,""),b=nextDay(t.due).replace(/-/g,"");
    let u="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("📌 "+t.title)+"&dates="+a+"/"+b+"&details="+encodeURIComponent((t.notes||"")+(t.category?"\n\nCategory: "+t.category:""));
    if(t.repeat&&RR[t.repeat])u+="&recur="+encodeURIComponent("RRULE:FREQ="+RR[t.repeat]);return u}
  function ocal(t){return "https://outlook.live.com/calendar/0/action/compose?allday=true&subject="+encodeURIComponent("📌 "+t.title)+"&startdt="+t.due+"&enddt="+nextDay(t.due)+"&body="+encodeURIComponent(t.notes||"")}
  function row(t){
    const isDone=t.status==="done";const[c,label]=isDone?["",t.completedAt?fmt(t.completedAt):""]:when(t);
    const end=ask===t.id?`<span class="sure"><button class="y" data-act="del" data-id="${t.id}">Delete</button><button class="n" data-act="no">Keep</button></span>`:`<button class="x" data-act="ask" data-id="${t.id}" aria-label="Delete">×</button>`;
    return `<li class="row ${isDone?"done":""}"><button class="tick" data-act="tick" data-id="${t.id}" aria-label="${isDone?"Mark as not done":"Mark as done"}">${isDone?"✓":""}</button>
      <div class="txt"><button class="open" data-act="open" data-id="${t.id}" aria-expanded="${openId===t.id}">${hl(t.title)}${t.notes?'<span class="has" aria-label="Has details"></span>':""}</button>${true?`<span class="when ${c}">${label}${t.repeat&&!isDone?`<span class="repeat">↻ ${{weekly:"Weekly",monthly:"Monthly",yearly:"Yearly"}[t.repeat]||""}</span>`:""}${CATS.includes(t.category)?`<span class="tag c${catIdx(t.category)}">${esc(t.category)}</span>`:(AI_ON?`<span class="tag sorting">Sorting…</span>`:"")}</span>`:""}
        ${q&&openId!==t.id&&t.notes?`<span class="snip">${hl(snip(t.notes))}</span>`:""}
        ${openId===t.id?`<div class="detail"><textarea id="d-${t.id}" rows="3" placeholder="Add details…" aria-label="Details">${esc(t.notes||"")}</textarea><label class="catpick">Category <select id="c-${t.id}">${CATS.map(c=>`<option ${c===t.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label><button class="save" data-act="save" data-id="${t.id}">Save</button>${t.due&&t.status!=="done"?`<div class="cal"><span>Add to my calendar</span><a href="${gcal(t)}" target="_blank" rel="noopener">Google Calendar</a><a href="${ocal(t)}" target="_blank" rel="noopener">Outlook</a></div>`:""}</div>`:""}</div>${end}</li>`;
  }

  $("#f-due").addEventListener("change",e=>{$("#dateLbl").textContent=e.target.value?"📅 "+fmt(e.target.value):"📅 Due"});
  $("#addForm").addEventListener("submit",async e=>{
    e.preventDefault();const title=$("#f-title").value.trim();if(!title||!loaded)return;
    const id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    $("#addBtn").disabled=true;
    const rep=$("#f-rep").value; let due=$("#f-due").value||""; if(rep&&!due)due=today();
    const nts=$("#f-notes").value.trim();try{await col().doc(id).set({title,due,notes:nts,category:autoCategory(title,nts),repeat:rep,rday:due?+due.slice(8,10):0,status:"open",createdAt:today(),completedAt:""});
      if(rep)toast("Repeating task added ↻");$("#f-rep").value="";
      $("#f-title").value="";$("#f-due").value="";$("#f-notes").value="";$("#f-notes").hidden=true;$("#moreBtn").hidden=false;$("#dateLbl").textContent="📅 Due";view="open";render();$("#f-title").focus();
      setTimeout(classify,600)}
    catch(_){toast("Couldn't save. Try again")}
    $("#addBtn").disabled=false;
  });
  document.addEventListener("click",async e=>{
    const b=e.target.closest("[data-act],[data-view]");if(!b)return;
    if(b.dataset.view){view=b.dataset.view;render();return}
    const id=b.dataset.id,t=tasks.find(x=>x.id===id);
    if(b.dataset.act==="tick"&&t){const d=t.status!=="done";try{await col().doc(id).update({status:d?"done":"open",completedAt:d?today():""});
      if(d&&t.repeat&&!t.nextMade){const nd=nextDue(t);const nid="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        await col().doc(nid).set({title:t.title,notes:t.notes||"",category:t.category||"",repeat:t.repeat,rday:t.rday||0,due:nd,status:"open",createdAt:today(),completedAt:""});
        await col().doc(id).update({nextMade:true});toast("Done ✓ Next one is set for "+fmt(nd))}
      else if(d){toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);if(!CATS.includes(t.category))setTimeout(classify,300)}}catch(_){toast("Couldn't save the change")}}
    else if(b.dataset.act==="quote"){qi=qi===null?0:(qi+1)%Q.length;const el=$("#quote");el.style.animation="none";void el.offsetWidth;el.style.animation="";render()}
    else if(b.dataset.act==="settings"){const st=$("#settings");st.hidden=!st.hidden;$("#gearBtn").setAttribute("aria-expanded",String(!st.hidden));if(!st.hidden){renderSettings();$("#s-name").value=myName;st.scrollIntoView({behavior:"smooth",block:"nearest"})}}
    else if(b.dataset.act==="color"){setPref("color",b.dataset.k)}
    else if(b.dataset.act==="font"){setPref("font",b.dataset.k)}
    else if(b.dataset.act==="savename"){const n=$("#s-name").value.trim();if(!n)return;try{await api("PUT","/api/me",{name:n});myName=n;render();toast("Saved")}catch(e){toast(e.error||"Couldn't save")}}
    else if(b.dataset.act==="logout"){try{await api("POST","/api/logout")}catch(_){}location.reload()}
    else if(b.dataset.act==="push"){enablePush()}
    else if(b.dataset.act==="tcat"){tcat=b.dataset.cat||null;render()}
    else if(b.dataset.act==="cat"){cat=b.dataset.cat||null;sumText="";render()}
    else if(b.dataset.act==="sum"){summarize()}
    else if(b.dataset.act==="open"){openId=openId===id?null:id;render()}
    else if(b.dataset.act==="save"&&t){const n=$("#d-"+id).value.trim(),cs=$("#c-"+id);const up={notes:n};if(cs&&cs.value!==t.category){up.category=cs.value;up.catManual=true}else if(!t.catManual)up.category=autoCategory(t.title,n);try{await col().doc(id).update(up);openId=null;render();toast("Saved")}catch(_){toast("Couldn't save")}}
    else if(b.dataset.act==="ask"){ask=id;render()}
    else if(b.dataset.act==="no"){ask=null;render()}
    else if(b.dataset.act==="del"){ask=null;try{await col().doc(id).delete()}catch(_){toast("Couldn't delete")}}
    else if(b.dataset.act==="copy"){
      const done=filteredDone();
      const txt="My achievements, "+fromD+" to "+toD+(cat?" — "+cat:"")+"\n"+(sumText?sumText+"\n\n":"")+done.map(t=>"- "+t.title+(t.category?" ["+t.category+"]":"")+" ("+fmt(t.completedAt)+")").join("\n");
      try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(_){toast("Couldn't copy")}
    }
  });

  document.addEventListener("change",e=>{
    if(e.target.id==="hol"){setPref("holidays",e.target.checked);return}
    if(e.target.id==="r-from"&&e.target.value){fromD=e.target.value;sumText="";render()}
    if(e.target.id==="r-to"&&e.target.value){toD=e.target.value;sumText="";render()}
  });
  $("#q").addEventListener("input",e=>{q=e.target.value.trim();openId=null;ask=null;render()});
  $("#moreBtn").addEventListener("click",()=>{$("#f-notes").hidden=false;$("#moreBtn").hidden=true;$("#f-notes").focus()});
  applyTheme(); render(); setInterval(()=>{if(!ask&&!openId){applyTheme();render()}},60000);
  // ---------- server connection ----------
  async function api(method,url,body){
    const r=await fetch(url,{method,headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
    const j=await r.json().catch(()=>({}));
    if(r.status===401&&!url.startsWith("/api/login")&&!url.startsWith("/api/signup")){showAuth(true);}
    if(!r.ok)throw Object.assign({status:r.status},j);
    return j;
  }
  let listeners=[],refreshing=null;
  async function refresh(){const rows=await api("GET","/api/tasks");const snap={docs:rows.map(x=>({id:x.id,data:()=>x.data}))};listeners.forEach(f=>f(snap))}
  function soon(){clearTimeout(refreshing);refreshing=setTimeout(()=>refresh().catch(()=>{}),120)}
  const tasksCol={
    doc:id=>({
      set:async d=>{await api("PUT","/api/tasks/"+encodeURIComponent(id),d);soon()},
      update:async d=>{const t=tasks.find(x=>x.id===id);if(t)Object.assign(t,d);render();await api("PATCH","/api/tasks/"+encodeURIComponent(id),d);soon()},
      delete:async()=>{tasks=tasks.filter(x=>x.id!==id);render();await api("DELETE","/api/tasks/"+encodeURIComponent(id));soon()}
    }),
    onSnapshot:(cb,err)=>{listeners.push(cb);refresh().catch(e=>err&&err(e));return()=>{}}
  };
  me={set:async p=>{const c=Object.assign({},p);delete c.name;await api("PUT","/api/me",{profile:c})}};
  let AI_ON=false,PUSH_ON=false,VAPID="";

  // ---------- sign in ----------
  let signup=true;
  function setMode(up){signup=up;$("#authBtn").textContent=up?"Create account":"Sign in";$("#authSwitch").textContent=up?"I already have an account":"Create a new account";$("#authSub").textContent=up?"Create your account to start":"Welcome back 💗";$("#a-pw").autocomplete=up?"new-password":"current-password";$("#authErr").hidden=true}
  function showAuth(on){$("#hi").hidden=!on;$("#app").hidden=on;if(on)setTimeout(()=>$("#a-name").focus(),50)}
  $("#authSwitch").addEventListener("click",()=>setMode(!signup));
  $("#authForm").addEventListener("submit",async e=>{
    e.preventDefault();const err=$("#authErr");err.hidden=true;
    const body={name:$("#a-name").value.trim(),password:$("#a-pw").value};
    $("#authBtn").disabled=true;
    try{await api("POST",signup?"/api/signup":"/api/login",body);location.reload()}
    catch(x){err.textContent=x.error||"Something went wrong. Try again.";err.hidden=false}
    $("#authBtn").disabled=false;
  });
  function blocked(msg){loaded=true;$("#addForm").hidden=true;$(".more").hidden=true;$("#view").innerHTML=`<div class="empty">${msg}</div>`}

  // ---------- notifications ----------
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  function b64u(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
  async function enablePush(){
    if(!PUSH_ON){toast("Notifications aren't set up yet");return}
    if(isIOS&&!standalone){$("#pushHint").textContent="On iPhone: tap Share → Add to Home Screen, open the app from your Home Screen, then turn notifications on here.";toast("Add to Home Screen first");return}
    if(!("serviceWorker" in navigator)||!("PushManager" in window)){toast("This browser can't show notifications");return}
    try{
      const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
      const perm=await Notification.requestPermission();
      if(perm!=="granted"){toast("Notifications are blocked in your settings");return}
      const sub=(await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)}));
      await api("POST","/api/push/subscribe",{sub:sub.toJSON()});
      await api("POST","/api/push/test");
      $("#pushBtn").textContent="Notifications are on ✓";toast("Notifications on 💗");
    }catch(e){toast("Couldn't turn on notifications")}
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});

  (async()=>{
    let info;
    try{info=await api("GET","/api/me")}catch(e){if(e.status===401){setMode(true);showAuth(true);return}blocked("Can't reach the server. Refresh the page.");return}
    db=true;myName=info.name||"";profile=Object.assign({},info.profile||{});if(profile.prefs)prefs=Object.assign(prefs,profile.prefs);
    AI_ON=!!info.ai;PUSH_ON=!!info.push;VAPID=info.vapid||"";
    applyTheme();setTimeout(dailyQuote,400);
    unsub=tasksCol.onSnapshot(s=>{tasks=s.docs.map(d=>Object.assign({id:d.id},d.data()));loaded=true;render();
      if(!classified&&tasks.some(t=>!CATS.includes(t.category))){classified=true;setTimeout(classify,800)}},
      ()=>{$("#view").innerHTML=`<div class="empty">Lost connection. Refresh the page.</div>`});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh().catch(()=>{})});
  })();
})();
</script>

</body>
