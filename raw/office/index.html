<title>طابق إيفنتانا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one live top-down office floor (people walk, meet, talk) beside a running office log; approvals strip on top; details open in one side panel — no tabs. */
:root{
  --ground:#EBEEF2; --floor:#F7F5F0; --wood:#E4D7C1; --ink:#16223A; --muted:#5D6880;
  --brass:#A8834B; --brass-soft:#EFE5D2; --glass:rgba(110,160,200,.16); --card:#FFFFFF; --line:#D6DBE3;
  --ok:#2E9A6B; --wait:#C98A1B; --stop:#C24D4D; --idle:#9AA3B2;
  --ev:#7A2E64; --mz:#1F7A80; --od:#3F5BA9; --mt:#C0761F; --hq:#8A6A2F;
  --kandura:#FBFBF9; --abaya:#1D1F26; --skin1:#D7A98A; --skin2:#B98466;
  --display:"El Messiri","Noto Kufi Arabic",serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --shadow:0 14px 34px -20px rgba(22,34,58,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#0D1422;--floor:#1A2131;--wood:#2B2A2A;--ink:#EEF1F6;--muted:#9AA6BC;--brass:#CFAE73;--brass-soft:#352E22;
  --glass:rgba(120,170,210,.12);--card:#1C2539;--line:#2C3852;--idle:#6C778C;
  --ev:#C46BA8;--mz:#3FB3B9;--od:#7D97E6;--mt:#E3A04E;--hq:#CFAE73;--kandura:#F1F1EC;--abaya:#05060A;--shadow:0 14px 34px -18px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#0D1422;--floor:#1A2131;--wood:#2B2A2A;--ink:#EEF1F6;--muted:#9AA6BC;--brass:#CFAE73;--brass-soft:#352E22;
  --glass:rgba(120,170,210,.12);--card:#1C2539;--line:#2C3852;--idle:#6C778C;
  --ev:#C46BA8;--mz:#3FB3B9;--od:#7D97E6;--mt:#E3A04E;--hq:#CFAE73;--kandura:#F1F1EC;--abaya:#05060A;--shadow:0 14px 34px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.brand h1{font-size:clamp(30px,4vw,44px)}
.brand p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.chip b{font-variant-numeric:tabular-nums}
.clock{font-family:var(--display);font-size:22px;color:var(--brass);font-variant-numeric:tabular-nums}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.ask::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.ask .who{font-size:12px;color:var(--muted)} .ask .what{font-weight:600} .ask .how{font-size:13px;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;gap:10px} .sec-h h2{font-size:20px} .sec-h span{font-size:13px;color:var(--muted)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:var(--shadow);overflow:hidden}
.viewport{position:relative;width:100%}
.iso{position:absolute;left:0;top:0;width:1500px;height:1000px;transform-origin:top left}
.floor{position:absolute;top:70px;left:150px;width:1200px;height:916px;transform-origin:50% 50%;transform:rotateX(55deg) rotateZ(-45deg);transform-style:preserve-3d;direction:ltr;
  background:var(--floor);border-radius:14px;
  background-image:repeating-linear-gradient(90deg,transparent 0 59px,color-mix(in srgb,var(--line) 70%,transparent) 59px 60px),
                   repeating-linear-gradient(0deg,transparent 0 59px,color-mix(in srgb,var(--line) 70%,transparent) 59px 60px)}
.zone{transform-style:preserve-3d;position:absolute;border:3px solid var(--brass);border-radius:16px;background:color-mix(in srgb,var(--c) 5%,transparent)}
.zone .lbl{position:absolute;top:-15px;right:18px;background:var(--floor);padding:0 10px;font-family:var(--display);font-size:20px;color:var(--c);direction:rtl;white-space:nowrap}
.zone .sub{position:absolute;bottom:-11px;right:18px;background:var(--floor);padding:0 8px;font-size:12px;color:var(--muted);direction:rtl}
.zone.meet{background:var(--glass);border-style:solid}
.table{position:absolute;border-radius:50%;background:var(--wood);border:2px solid var(--brass)}
.desk{transform-style:preserve-3d;transform:translateZ(18px);box-shadow:0 0 0 1px rgba(0,0,0,.08);position:absolute;width:74px;height:40px;border-radius:8px;background:var(--wood);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.desk .scr{transform-origin:50% 100%;transform:rotateX(-90deg);position:absolute;left:50%;top:4px;width:34px;height:16px;margin-left:-17px;border-radius:3px;background:#2B3346;border:2px solid #3B455C}
.desk.on .scr{background:linear-gradient(180deg,#9FD3E8,#5DA9C9);box-shadow:0 0 10px rgba(110,190,230,.6)}
.desk.wait .scr{background:linear-gradient(180deg,#F4D58D,#E0A93C);box-shadow:0 0 10px rgba(230,170,60,.55)}
.desk.stop .scr{background:#6B2C2C}
.plant{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#86C08A,#3D7A49);box-shadow:0 0 0 4px rgba(61,122,73,.15)}
.sofa{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--brass) 35%,var(--floor))}
.coffee{position:absolute;width:34px;height:34px;border-radius:8px;background:#3B2E25;border:2px solid var(--brass)}

.p{transform-style:preserve-3d;position:absolute;left:0;top:0;width:58px;height:76px;margin:-60px 0 0 -29px;transition:transform 1.9s cubic-bezier(.45,.05,.4,1);z-index:3;cursor:pointer;background:none;border:0;padding:0}
.p .fig{position:absolute;inset:0}
.p .body{position:absolute;left:12px;top:29px;width:34px;height:40px;border-radius:17px 17px 8px 8px;background:var(--kandura);border:1px solid rgba(0,0,0,.12)}
.p.f .body{background:var(--abaya);border-color:rgba(255,255,255,.08)}
.p .head{position:absolute;left:16px;top:5px;width:26px;height:26px;border-radius:50%;background:var(--skin)}
.p.m .head::before{content:"";position:absolute;inset:-3px -3px 6px -3px;border-radius:10px 10px 4px 4px;background:var(--kandura);border:1px solid rgba(0,0,0,.12);z-index:-1}
.p.m .head::after{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:4px;border-radius:3px;background:#1B1B1B}
.p.f .head{box-shadow:0 0 0 4px var(--abaya)}
.p .badge{position:absolute;left:22px;top:45px;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--kandura)}
.p .name{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;white-space:nowrap;direction:rtl;
  background:color-mix(in srgb,var(--card) 85%,transparent);padding:0 6px;border-radius:6px;color:var(--ink)}
.p .st{position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--s);border:2px solid var(--floor)}
.p.x .body{background:var(--ev);border-color:rgba(0,0,0,.15)}
.p.real .name{background:var(--brass-soft);outline:1px solid var(--brass)}
.p.real .badge{background:var(--brass);border-color:var(--brass-soft)}
.p.walk .fig{animation:bob .38s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.p .typing{position:absolute;left:50%;top:-12px;transform:translateX(-50%);display:none;gap:3px}
.p.typingon .typing{display:flex}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:.25}}
.bub{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  width:max-content;max-width:270px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.5;
  direction:rtl;box-shadow:var(--shadow);z-index:5}
.bub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.p.talk .bub{opacity:1;transform:translateX(-50%) scale(1)}
.p.talk{z-index:6}

.log{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:min(78vh,900px);box-shadow:var(--shadow)}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.log li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,transparent);border-inline-start:3px solid var(--c);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.log .meta{font-size:12px;color:var(--muted)} .log .txt{font-size:14px}
.talk{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--floor)}
.talk .thread{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.talk .msg.me{align-self:flex-start}.talk .msg.them{align-self:flex-end;background:var(--card)}
.talk .tbar{display:flex;gap:6px;flex-wrap:wrap}
.mcard{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--brass-soft);border:1px solid var(--brass)}
.mcard #mlines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.mcard .ln b{color:var(--brass)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--brass);align-self:flex-start}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}

.scrim{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:20}
.panel{position:fixed;z-index:21;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:var(--card);border-inline-start:1px solid var(--line);
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.panel .x{align-self:flex-start;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px}
.ph h2{font-size:26px} .ph .note{margin-top:-2px}
.sec{display:flex;flex-direction:column;gap:6px} .sec h4{margin:0;font-size:12px;color:var(--muted);font-weight:600} .sec ul{margin:0;padding-inline-start:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--s) 15%,transparent)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s)}
textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--floor);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.chat{display:flex;flex-direction:column;gap:8px}.msg{border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap}
.msg.me{background:var(--brass-soft)}.msg.them{background:var(--floor);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted)}
.picks{display:flex;flex-wrap:wrap;gap:6px}.pick{border:1px solid var(--line);background:var(--floor);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.turn{background:var(--floor);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}.summary{background:var(--brass-soft);border-radius:12px;padding:10px 14px;font-size:14px}

@media (max-width:1000px){.main{grid-template-columns:1fr}.log{max-height:420px}}
@media (max-width:640px){.cards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.ask{scroll-snap-align:start}}
.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
@media (prefers-reduced-motion:reduce){.p{transition:none}.p.walk .fig,.typing i{animation:none}.log li{animation:none}}
.p .up{position:absolute;inset:0;transform-origin:50% 80%;transform:rotateZ(45deg) rotateX(-55deg)}
.zone .lbl{transform-origin:50% 100%;transform:translateZ(70px) rotateZ(45deg) rotateX(-55deg);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);border-radius:8px}
.zone .sub{transform-origin:50% 100%;transform:rotateZ(45deg) rotateX(-55deg)}
.wall{position:absolute;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);transform-origin:0 0;pointer-events:none}
.wall.top{height:56px;transform:rotateX(90deg)}
.wall.right{width:56px;transform-origin:0 0;transform:rotateY(-90deg)}
.desk::before{content:"";position:absolute;inset:0;border-radius:8px;background:color-mix(in srgb,var(--wood) 70%,#000);transform:translateZ(-18px)}
.plant{transform:translateZ(14px)}
/* 3D floor overlay */
.viewport{position:relative;width:100%;border-radius:14px;overflow:hidden;touch-action:none}
.viewport canvas.gl{display:block;width:100%;cursor:grab;border-radius:14px}
.overlay{position:absolute;inset:0;pointer-events:none;direction:rtl}
.overlay .p{all:unset;position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}
.overlay .p .card{display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 7px 3px;box-shadow:0 4px 12px rgba(0,0,0,.10);position:relative;min-width:54px}
.overlay .p.real .card{border-color:var(--brass);background:var(--brass-soft)}
.overlay .p .name{position:static;transform:none;background:none;font-size:11.5px;font-weight:700;line-height:1.25;color:var(--ink);padding:0}
.overlay .p .rl{font-size:9.5px;color:var(--muted);line-height:1.2;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.overlay .p .st{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--s);border:0}
.overlay .p .typing{position:static;transform:none;display:none;gap:3px;order:-1}
.overlay .p.typingon .typing{display:flex}
.overlay .p .bub{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(.9);font-size:13px;max-width:240px}
.overlay .p.talk .bub{opacity:1;transform:translateX(-50%) scale(1)}
.overlay .p:focus-visible .card{outline:2px solid var(--brass)}
.overlay .zl{position:absolute;left:0;top:0;font-family:var(--display);font-size:15px;color:var(--c);background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:1px 12px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.overlay .p .mood{font-size:20px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:999px;padding:3px 4px}
.overlay .p.real .mood{font-size:14px}
.overlay .p .pop{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);flex-direction:column;align-items:flex-start;gap:2px;min-width:170px;max-width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.16);text-align:right}
.overlay .p.open .pop{display:flex}
.overlay .p.open{z-index:99999!important}
.overlay .p .pop .name{font-size:15px}
.overlay .p .pop .rl{font-size:12px;max-width:none;white-space:normal}
.overlay .p .pop .ml{font-size:12px;background:var(--brass-soft);border-radius:999px;padding:0 8px}
.overlay .p .pop .tk{font-size:12px;color:var(--ink);white-space:normal;line-height:1.5}
.overlay .p .pop .more{font-size:12px;color:var(--brass);text-decoration:underline;cursor:pointer}
.overlay .p .bub,.overlay .p .typing,.overlay .p .card{display:none!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);padding:2px 4px 8px}
</style>

<div class="wrap" dir="rtl">
  <header class="top">
    <div class="brand"><h1>طابق إيفنتانا</h1><p>فريق إيفنتانا كامل، والسكرتيرة هي اللي تكلمج</p></div>
    <div class="chips" id="chips"></div>
    <div class="clock" id="clock"></div>
  </header>

  <section aria-labelledby="ask-h" style="display:flex;flex-direction:column;gap:8px">
    <div class="sec-h"><h2 id="ask-h">شمّا تسألج</h2><span>بس اللي فعلاً يحتاج ردّج</span></div>
    <div class="cards" id="asks"></div>
  </section>

  <div class="main">
    <section class="stage" aria-label="المكتب">
      <div class="legend" id="legend"></div><div class="legend" id="opsU"></div><div class="viewport" id="vp"><div class="overlay" id="floor"></div></div>
    </section>
    <aside class="log" aria-labelledby="log-h">
      <div class="sec-h" style="justify-content:space-between"><h2 id="log-h">سوالف المكتب</h2><button class="btn" id="meetBtn" type="button">ابدئي اجتماع</button></div>
      <div class="mcard" id="mcard"><b>اجتماعج مع شمّا</b><span class="note" id="mstate">كل يوم الساعة 5:30 المسا، بس إذا فيه شي مهم.</span><div id="mlines"></div><button class="btn ghost" id="mplay" type="button" hidden>شوفي الاجتماع</button></div>
      <div class="talk" aria-label="كلمي شمّا">
        <b>كلمي شمّا</b>
        <div class="thread" id="thread"><div class="msg them">أنا شمّا، قولي لي اللي تبينه وأنا أوصله للفريق.</div></div>
        <textarea id="sayBox" rows="2" placeholder="اكتبي لشمّا، أو اضغطي تكلمي"></textarea>
        <div class="tbar"><button class="btn" id="sendS" type="button">أرسلي</button><button class="btn ghost" id="mic" type="button" hidden>تكلمي</button><button class="btn ghost" id="listen" type="button" hidden>اسمعي آخر رد</button></div>
        <span class="note" id="tnote"></span>
      </div>
      <ul id="feed" aria-live="polite"></ul>
    </aside>
  </div>
</div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ST={team:{t:"فريق حقيقي",c:"var(--brass)"},soon:{t:"يبدأ بعد موافقتج",c:"var(--idle)"},work:{t:"شغّال",c:"var(--ok)"},wait:{t:"ينتظرج",c:"var(--wait)"},stop:{t:"متوقف",c:"var(--stop)"},idle:{t:"متفرغ",c:"var(--idle)"},new:{t:"ينتظر تعريف المشروع",c:"var(--idle)"}};
const Z={ /* x,y,w,h on a 1200x1020 floor — Eventana only */
  mkt:{name:"التسويق",sub:"إعلانات · محتوى · إنتاج · مراجعة",c:"var(--ev)",x:24,y:24,w:760,h:300,cols:6},
  sec:{name:"مكتب السكرتيرة",sub:"هي اللي تكلمج",c:"var(--hq)",x:808,y:24,w:368,h:140,cols:1},
  meet:{name:"غرفة الاجتماعات",sub:"زجاج",c:"var(--brass)",x:808,y:184,w:368,h:140},

function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("ar-AE",{hour:"numeric",minute:"2-digit",timeZone:"Asia/Dubai"})+" · "+d.toLocaleDateString("ar-AE",{weekday:"long",day:"numeric",month:"long",timeZone:"Asia/Dubai"})}
tick();setInterval(tick,30000);

/* side panel: person + meeting (Claude sampling when available) */
let sp=null;const getSample=()=>sp||(sp=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null));
const CONTEXT=`أنت موظف في مكتب افتراضي لشيماء، صاحبة إيفنتانا (حفلات أطفال في الإمارات). أنت في طابق إيفنتانا. تكلم باللهجة الخليجية فقط بدون أي كلمة إنجليزية، بجمل قصيرة. لا تخترع أرقام أو حقائق، قل «أحتاج أتأكد». قواعد إيفنتانا: ${RULES.ev.join("، ")}. التنفيذ الفعلي يصير لما شيماء ترد بالمحادثة الرئيسية.`;
function closeLayer(){document.getElementById("layer").innerHTML=""}
function shell(inner){const L=document.getElementById("layer");
  L.innerHTML=`<div class="scrim"></div><aside class="panel" dir="rtl" role="dialog" aria-modal="true"><button class="x" type="button">إغلاق</button>${inner}</aside>`;
  L.querySelector(".scrim").onclick=closeLayer;L.querySelector(".x").onclick=closeLayer;return L.querySelector(".panel")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer()});
function openPerson(p){
  const z=Z[p.z],rules=[...RULES.ev,...RULES.hq];
  const P=shell(`<div class="ph"><h2 style="color:${z.c}">${esc(p.name)}</h2><div class="note">${esc(p.role)} · ${esc(z.name)}</div></div>
   <div class="sec"><h4>الحين</h4><div><span class="pill" style="--s:${ST[p.st].c}">${ST[p.st].t}</span></div><div>${esc(p.task)}</div></div>
   <div class="sec"><h4>شغله</h4><ul>${p.does.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   <div class="sec"><h4>القواعد</h4><ul>${rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   ${p.real?`<div class="note">من فريق إيفنتانا الحقيقي. موظفين الذكاء الاصطناعي يجهّزون لها الشغل، وهي تراجع وترسل.</div>`:""}<div class="sec" ${p.real?"hidden":""}><h4>اسأليه</h4><div class="chat" id="chat"></div><textarea id="q" rows="2" placeholder="اكتبي سؤالج"></textarea>
   <div><button class="btn" id="send" type="button">أرسلي</button></div><div class="note" id="sn">رد للمشورة. التنفيذ والصرف بعد ردّج علي بالمحادثة.</div></div>`);
  const chat=P.querySelector("#chat"),q=P.querySelector("#q"),send=P.querySelector("#send"),sn=P.querySelector("#sn");
  getSample().then(s=>{if(!s){sn.textContent="الدردشة تشتغل لما تفتحين الصفحة من حسابج.";send.disabled=true}});
  send.onclick=async()=>{const text=q.value.trim();if(!text)return;q.value="";
    chat.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(text)}</div>`);const out=document.createElement("div");out.className="msg them";out.textContent="يفكّر…";chat.appendChild(out);send.disabled=true;
    try{const s=await getSample();const r=await s(`${CONTEXT}\nأنت ${p.name}، ${p.role} في ${z.name}. شغلك: ${p.does.join("، ")}. شغلك الحالي: ${p.task}.\nشيماء تسألك: ${text}\nرد بأقل من 80 كلمة.`,{modelTier:"quick",cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text}
    catch(e){out.textContent=e&&e.code==="rate_limited"?"الطلبات كثيرة، جربي بعد دقيقة.":"ما قدرت أرد الحين."}
    send.disabled=false};
}
document.getElementById("meetBtn").onclick=()=>{
  const P=shell(`<h2>اجتماع جديد</h2><div class="sec"><h4>الفكرة</h4><textarea id="idea" rows="3" placeholder="اكتبي الفكرة"></textarea></div>
   <div class="sec"><h4>مين يحضر</h4><div class="picks">${T.filter(p=>p.st!=="new"&&!p.real).map(p=>`<button type="button" class="pick" data-id="${p.id}" aria-pressed="${["shamma","kafu","hamdan","saeed","maitha"].includes(p.id)}">${esc(p.name)}</button>`).join("")}</div></div>
   <div><button class="btn" id="go" type="button">ابدأوا</button></div><div class="note" id="mn">كل واحد يعطي رايه من تخصصه، وشمّا تطلع الخلاصة. القرار لج.</div><div id="min" style="display:flex;flex-direction:column;gap:8px"></div>`);
  P.querySelectorAll(".pick").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
  const go=P.querySelector("#go"),min=P.querySelector("#min"),mn=P.querySelector("#mn");
  getSample().then(s=>{if(!s){mn.textContent="الاجتماع يشتغل لما تفتحين الصفحة من حسابج.";go.disabled=true}});
  go.onclick=async()=>{const idea=P.querySelector("#idea").value.trim();const sel=[...P.querySelectorAll('.pick[aria-pressed="true"]')].map(b=>byId(b.dataset.id));if(!idea||!sel.length)return;
    min.innerHTML=`<div class="note">الفريق يتناقش…</div>`;go.disabled=true;
    const ps=sel.slice(0,4).filter(p=>!p.busy);ps.forEach(p=>{p.busy=true;setDesk(p)});
    const z=Z.meet,spots=[[z.x+70,z.y+70],[z.x+300,z.y+70],[z.x+150,z.y+70],[z.x+225,z.y+70]];ps.forEach((p,i)=>walk(p,spots[i][0],spots[i][1]));
    try{const s=await getSample();
      const res=await s.json(`${CONTEXT}\nاجتماع. الحضور:\n${sel.map(p=>`- ${p.name} (${p.role}): ${p.does.join("، ")}`).join("\n")}\nفكرة شيماء: ${idea}\nكل واحد يعطي رايه من تخصصه بجملتين أو ثلاث، وبعدها شمّا تكتب خلاصة وقرارات مقترحة تحتاج موافقة شيماء. رجّع JSON فقط: {"turns":[{"name":"...","text":"..."}],"summary":"..."}`,{modelTier:"default"});
      min.innerHTML="";for(const t of (res.turns||[])){min.insertAdjacentHTML("beforeend",`<div class="turn"><b>${esc(t.name||"")}</b><br>${esc(t.text||"")}</div>`);const p=T.find(x=>x.name===t.name);if(p){log(p,null,t.text||"");say(p,(t.text||"").slice(0,90),3500)}}
      if(res.summary)min.insertAdjacentHTML("beforeend",`<div class="summary"><b>خلاصة شمّا</b><br>${esc(res.summary)}</div>`);
    }catch(e){min.innerHTML=`<div class="note">${e&&e.code==="rate_limited"?"الطلبات كثيرة، جربي بعد دقيقة.":"ما قدرنا نكمل الاجتماع الحين."}</div>`}
    await sleep(3600);await Promise.all(ps.map(p=>walk(p,SEAT[p.id].x,SEAT[p.id].y)));ps.forEach(p=>{p.busy=false;setDesk(p)});go.disabled=false};
};
</script>
