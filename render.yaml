# Eventana — Render blueprint.
#
# Three services and one database:
#   eventana-api        the engine (Node web service)
#   eventana-customer   the customer app (static site)
#   eventana-dashboard  internal operations (static site)
#   eventana-db         PostgreSQL
#
# No secret appears in this file. Everything marked `sync: false` must be
# set in the Render dashboard, per service, by someone who holds the key.
#
# Deploy: Render → New → Blueprint → pick this repository.

databases:
  - name: eventana-db
    databaseName: eventana
    user: eventana
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: eventana-api
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to the UAE
    branch: main
    buildCommand: npm ci && npm run build -w @eventana/shared && npm run build -w @eventana/api
    startCommand: npm run start -w @eventana/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eventana-db
          property: connectionString
      # Applies the schema and seeds an EMPTY catalogue at boot. The seed
      # never overwrites prices Eventana has since edited.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      # Render can only pass another service's HOST, never a full URL, so
      # these are hostnames and the API adds the https:// scheme itself.
      # Discovering the host this way (rather than hardcoding a URL) keeps
      # working when Render appends a suffix to a taken subdomain.
      - key: PUBLIC_API_HOST
        fromService:
          name: eventana-api
          type: web
          property: host
      - key: PUBLIC_APP_HOST
        fromService:
          name: eventana-customer
          type: static
          property: host
      - key: PUBLIC_DASHBOARD_HOST
        fromService:
          name: eventana-dashboard
          type: static
          property: host

      # Staff access to /api/admin. Render generates it; read it from the
      # dashboard and give it only to Eventana staff.
      - key: STAFF_TOKEN
        generateValue: true

      # --- payment providers -------------------------------------------
      # Set these in the Render dashboard when the merchant accounts
      # exist. While any is missing that provider runs simulated and the
      # deployment must carry ALLOW_SIMULATED_PAYMENTS to boot at all.
      - key: ALLOW_SIMULATED_PAYMENTS
        value: "true"          # ← set to "false" once real keys are in
      - key: EVENTANA_PAYMENT_MODE
        value: sandbox         # ← "live" only after the 9-case test plan passes
      - key: TABBY_PUBLIC_KEY
        sync: false
      - key: TABBY_SECRET_KEY
        sync: false
      - key: TABBY_MERCHANT_CODE
        sync: false
      - key: TABBY_WEBHOOK_SECRET
        sync: false
      - key: TAMARA_PUBLIC_KEY
        sync: false
      - key: TAMARA_API_TOKEN
        sync: false
      - key: TAMARA_NOTIFICATION_TOKEN
        sync: false
      - key: ZIINA_API_KEY
        sync: false
      - key: ZIINA_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # --- Meta ads attribution ----------------------------------------
      # Reports each PAID booking back to the ad account (Conversions API),
      # so Ads Manager can finally show bookings and ROAS instead of only
      # WhatsApp conversations. META_PIXEL_ID is the dataset id from Events
      # Manager; the token is generated against that same dataset. Either
      # absent → reporting is a silent no-op and nothing else changes.
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_ACCESS_TOKEN
        sync: false
      # Set ONLY while verifying in Events Manager → Test Events. Leave it
      # unset in production or real bookings land in the test bucket.
      - key: META_TEST_EVENT_CODE
        sync: false

      # --- WhatsApp Cloud API ------------------------------------------
      # Records every enquiry as a lead (who asked, for which party date,
      # and which ad sent them) and can answer on the business number.
      # Webhook URL to register with Meta:
      #   https://<api host>/api/webhooks/whatsapp
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      # A string you invent; Meta echoes it back when registering the hook.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # The Meta app secret — proves an inbound payload really came from
      # Meta. Without it every webhook is rejected as untrusted.
      - key: WHATSAPP_APP_SECRET
        sync: false
      # THE SAFETY SWITCH. Every message here reaches a real customer.
      #   off   — read and record only (default, and where to start)
      #   greet — one automatic reply to a first-time enquiry
      #   full  — also answers catalogue questions
      - key: WHATSAPP_AGENT_MODE
        value: "off"

  # ----------------------------------------------------- customer app
  - type: web
    name: eventana-customer
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build -w @eventana/shared && npm run build -w @eventana/customer
    staticPublishPath: apps/customer/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # A hostname; the app adds https:// itself.
      - key: VITE_API_HOST
        fromService:
          name: eventana-api
          type: web
          property: host
      # Meta pixel. Build-time, so a rebuild is needed after setting it.
      # Absent → the app ships no tracking script at all. Present → page
      # views and checkout starts are reported, which is what makes website
      # retargeting audiences possible.
      - key: VITE_META_PIXEL_ID
        sync: false
      # Google Analytics 4 measurement id, G-XXXXXXXXXX. Absent → no GA4.
      - key: VITE_GA4_ID
        sync: false
      # Google Ads conversion id, AW-XXXXXXXXX, and the label of the "Booking"
      # conversion action. BOTH are needed before a paid booking is reported
      # to Google Ads; either one missing → the tag stays silent.
      - key: VITE_GOOGLE_ADS_ID
        sync: false
      - key: VITE_GOOGLE_ADS_PURCHASE_LABEL
        sync: false
    routes:
      # The payment return lands on /pay/return?order=… — serve the app
      # for any path so a refresh there does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ------------------------------------------------ internal dashboard
  - type: web
    name: eventana-dashboard
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build -w @eventana/shared && npm run build -w @eventana/dashboard
    staticPublishPath: apps/dashboard/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # A hostname; the app adds https:// itself.
      - key: VITE_API_HOST
        fromService:
          name: eventana-api
          type: web
          property: host
      # The staff token the dashboard sends. Must match the API's
      # STAFF_TOKEN — copy it across in the Render dashboard.
      - key: VITE_STAFF_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
