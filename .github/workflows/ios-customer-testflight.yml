# Build the Eventana CUSTOMER app on a cloud Mac and upload to TestFlight.
# No local Mac required — GitHub's macos runner does the iOS build.
#
# This is a STARTER workflow (authored without a Mac to test it — expect to
# tweak Xcode/scheme details on the first run). It runs only on manual
# dispatch, so it never fires by accident.
#
# ── Required repository secrets (Settings → Secrets and variables → Actions) ──
#   APPLE_TEAM_ID                 Your 10-char Apple Developer Team ID
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY     The .p8 API key, base64-encoded
#                                 (macOS: base64 -i AuthKey_XXXX.p8 | pbcopy)
#
# Create the API key at: App Store Connect → Users and Access → Integrations
# → App Store Connect API (role: App Manager). The app record with bundle id
# `ae.eventana.customer` should exist first (or automatic signing creates the
# signing assets; the app record itself is created in App Store Connect).

name: iOS Customer → TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (+ Capacitor for the customer app)
        run: |
          npm ci
          npm install -w @eventana/customer \
            @capacitor/core@^6 @capacitor/ios@^6 @capacitor/cli@^6

      - name: Build web assets and generate the iOS project
        run: |
          npm run build -w @eventana/shared    # customer imports @eventana/shared
          npm run build -w @eventana/customer
          cd apps/customer
          npx cap add ios || true   # no-op if ios/ already exists
          npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          OUT="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          CLEAN=$(printf '%s' "$ASC_KEY" | tr -d '[:space:]')
          if printf '%s' "$ASC_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            # (a) Secret holds the raw .p8 (PEM) — use as-is.
            printf '%s\n' "$ASC_KEY" > "$OUT"
          else
            DEC="$HOME/private_keys/dec.bin"
            printf '%s' "$CLEAN" | base64 --decode > "$DEC" 2>/dev/null || true
            if head -c 27 "$DEC" | grep -q 'BEGIN PRIVATE KEY'; then
              # (b) Secret is base64 of the whole .p8 file.
              cp "$DEC" "$OUT"
            elif [ "$(head -c1 "$DEC" | od -An -tx1 | tr -d ' ')" = "30" ]; then
              # (c) Secret is the bare key body (base64 of DER) — wrap in PEM.
              { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$CLEAN" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$OUT"
            fi
            rm -f "$DEC"
          fi
          if ! head -1 "$OUT" 2>/dev/null | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::APP_STORE_CONNECT_API_KEY could not be resolved to a valid .p8. Store the base64 of the WHOLE key file: base64 -w0 AuthKey_XXXX.p8"
            echo "debug: secret length=${#ASC_KEY}"
            exit 1
          fi
          echo "Resolved a valid App Store Connect .p8 key."

      - name: Archive and export IPA (automatic signing)
        working-directory: apps/customer/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        working-directory: apps/customer/ios/App
        run: |
          xcrun altool --upload-app -t ios -f build/export/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Save the IPA as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventana-customer-ipa
          path: apps/customer/ios/App/build/export/*.ipa
          if-no-files-found: ignore
